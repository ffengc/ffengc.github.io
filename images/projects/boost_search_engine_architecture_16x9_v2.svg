<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#475569"/></marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.12"/></filter>
    <style>
      .title{font-family:Inter,Arial,sans-serif;font-weight:800;font-size:34px;fill:#0f172a}.subtitle{font-family:Inter,Arial,sans-serif;font-size:17px;fill:#475569}.cluster-title{font-family:Inter,Arial,sans-serif;font-weight:700;font-size:20px;fill:#334155}.box-title{font-family:Inter,Arial,sans-serif;font-weight:750;font-size:16px;fill:#111827}.box-text{font-family:Inter,Arial,sans-serif;font-size:13px;fill:#334155}.label{font-family:Inter,Arial,sans-serif;font-size:12px;fill:#475569}.line{stroke:#475569;stroke-width:2;fill:none;marker-end:url(#arrow)}.dash{stroke:#64748b;stroke-width:2;fill:none;stroke-dasharray:6 5;marker-end:url(#arrow)}.dot{stroke:#94a3b8;stroke-width:1.6;fill:none;stroke-dasharray:3 5}.cluster{fill:#ffffff;stroke:#cbd5e1;stroke-width:2;stroke-dasharray:8 6;rx:22}.box{stroke:#263241;stroke-width:1.5;rx:14;filter:url(#shadow)}
    </style>
  </defs>
  <rect width="1600" height="900" fill="white"/>
  <text x="800" y="54" text-anchor="middle" class="title">Boost Documentation Search Engine</text>
  <text x="800" y="82" text-anchor="middle" class="subtitle">C++ search system over local Boost HTML documentation · offline indexing + online query serving</text>

  <!-- cluster panels -->
  <rect x="62" y="120" width="1476" height="210" class="cluster"/>
  <text x="92" y="152" class="cluster-title">Offline Index Construction Pipeline</text>
  <rect x="62" y="360" width="1476" height="170" class="cluster"/>
  <text x="92" y="392" class="cluster-title">Core Index Data Structures</text>
  <rect x="62" y="560" width="1476" height="240" class="cluster"/>
  <text x="92" y="592" class="cluster-title">Online Query Serving Pipeline</text>

  <!-- offline boxes -->
  <rect x="100" y="185" width="245" height="90" fill="#eff6ff" class="box"/>
  <text x="222" y="211" text-anchor="middle" class="box-title">Boost HTML Docs</text>
  <text x="222" y="235" text-anchor="middle" class="box-text">~8.5K local .html files</text>
  <text x="222" y="256" text-anchor="middle" class="box-text">original documentation corpus</text>

  <rect x="420" y="175" width="280" height="110" fill="#dbeafe" class="box"/>
  <text x="560" y="201" text-anchor="middle" class="box-title">Parser Module</text>
  <text x="440" y="226" class="box-text">• enumerate files via Boost.Filesystem</text>
  <text x="440" y="247" class="box-text">• extract title / content / URL</text>
  <text x="440" y="268" class="box-text">• remove HTML tags by state machine</text>

  <rect x="775" y="185" width="230" height="90" fill="#e0f2fe" class="box"/>
  <text x="890" y="211" text-anchor="middle" class="box-title">raw.bin</text>
  <text x="890" y="235" text-anchor="middle" class="box-text">serialized cleaned corpus</text>
  <text x="890" y="256" text-anchor="middle" class="box-text">title \3 content \3 url</text>

  <rect x="1080" y="175" width="330" height="110" fill="#dcfce7" class="box"/>
  <text x="1245" y="201" text-anchor="middle" class="box-title">Index Builder</text>
  <text x="1100" y="226" class="box-text">• parse raw records and assign doc_id</text>
  <text x="1100" y="247" class="box-text">• segment title/content via cppjieba</text>
  <text x="1100" y="268" class="box-text">• compute weighted relevance</text>

  <!-- core boxes -->
  <rect x="235" y="425" width="320" height="78" fill="#f0fdf4" class="box"/>
  <text x="395" y="451" text-anchor="middle" class="box-title">Forward Index</text>
  <text x="395" y="474" text-anchor="middle" class="box-text">vector&lt;doc_info&gt;</text>
  <text x="395" y="493" text-anchor="middle" class="box-text">doc_id → title / content / url</text>

  <rect x="640" y="425" width="335" height="78" fill="#f0fdf4" class="box"/>
  <text x="808" y="451" text-anchor="middle" class="box-title">Inverted Index</text>
  <text x="808" y="474" text-anchor="middle" class="box-text">unordered_map&lt;word, list&gt;</text>
  <text x="808" y="493" text-anchor="middle" class="box-text">word → (doc_id, weight)</text>

  <rect x="1060" y="425" width="290" height="78" fill="#ede9fe" class="box"/>
  <text x="1205" y="451" text-anchor="middle" class="box-title">Singleton Index</text>
  <text x="1205" y="476" text-anchor="middle" class="box-text">built once, reused by queries</text>

  <!-- online boxes -->
  <rect x="100" y="650" width="200" height="82" fill="#fff7ed" class="box"/>
  <text x="200" y="684" text-anchor="middle" class="box-title">User Browser</text>
  <text x="200" y="708" text-anchor="middle" class="box-text">enter keyword</text>

  <rect x="355" y="635" width="230" height="112" fill="#ffedd5" class="box"/>
  <text x="470" y="662" text-anchor="middle" class="box-title">Frontend Page</text>
  <text x="470" y="687" text-anchor="middle" class="box-text">HTML / CSS / JS / jQuery</text>
  <text x="470" y="709" text-anchor="middle" class="box-text">Ajax request</text>
  <text x="470" y="731" text-anchor="middle" class="box-text">render ranked results</text>

  <rect x="650" y="635" width="250" height="112" fill="#fef3c7" class="box"/>
  <text x="775" y="662" text-anchor="middle" class="box-title">cpp-httplib Server</text>
  <text x="775" y="687" text-anchor="middle" class="box-text">GET /s?word=...</text>
  <text x="775" y="709" text-anchor="middle" class="box-text">static files + JSON API</text>

  <rect x="960" y="625" width="285" height="132" fill="#fae8ff" class="box"/>
  <text x="1102" y="652" text-anchor="middle" class="box-title">Searcher Module</text>
  <text x="985" y="678" class="box-text">• query segmentation</text>
  <text x="985" y="699" class="box-text">• lookup inverted lists</text>
  <text x="985" y="720" class="box-text">• merge + deduplicate docs</text>
  <text x="985" y="741" class="box-text">• sort by weight + generate snippets</text>

  <rect x="1300" y="642" width="180" height="98" fill="#fdf4ff" class="box"/>
  <text x="1390" y="671" text-anchor="middle" class="box-title">JSON Results</text>
  <text x="1390" y="696" text-anchor="middle" class="box-text">title / desc / url</text>
  <text x="1390" y="718" text-anchor="middle" class="box-text">ranked list</text>

  <!-- utilities -->
  <rect x="455" y="820" width="690" height="42" fill="#f1f5f9" class="box"/>
  <text x="800" y="846" text-anchor="middle" class="box-text">Shared Utilities: Boost split/to_lower · cppjieba · Jsoncpp · logging</text>

  <!-- arrows offline -->
  <path d="M345 230 H420" class="line"/><text x="382" y="219" text-anchor="middle" class="label">input/*.html</text>
  <path d="M700 230 H775" class="line"/><text x="738" y="219" text-anchor="middle" class="label">clean &amp; serialize</text>
  <path d="M1005 230 H1080" class="line"/><text x="1042" y="219" text-anchor="middle" class="label">load</text>

  <!-- arrows index build -->
  <path d="M1180 285 V340 H395 V425" class="line"/><text x="770" y="355" text-anchor="middle" class="label">build forward index</text>
  <path d="M1280 285 V365 H808 V425" class="line"/><text x="1010" y="380" text-anchor="middle" class="label">build inverted index</text>
  <path d="M555 464 H640" class="dash"/><text x="598" y="454" text-anchor="middle" class="label">owned by</text>
  <path d="M975 464 H1060" class="dash"/><text x="1018" y="454" text-anchor="middle" class="label">owned by</text>

  <!-- arrows online -->
  <path d="M300 691 H355" class="line"/>
  <path d="M585 691 H650" class="line"/><text x="618" y="680" text-anchor="middle" class="label">Ajax GET</text>
  <path d="M900 691 H960" class="line"/><text x="930" y="680" text-anchor="middle" class="label">search(word)</text>
  <path d="M1245 691 H1300" class="line"/><text x="1273" y="680" text-anchor="middle" class="label">serialize</text>
  <path d="M1390 642 V600 H775 V635" class="line"/><text x="1068" y="615" text-anchor="middle" class="label">application/json response</text>
  <path d="M1205 503 V582 H1102 V625" class="line"/><text x="1162" y="560" text-anchor="middle" class="label">read-only lookup</text>

  <!-- dotted util connections -->
  <path d="M560 285 V820" class="dot"/>
  <path d="M1245 285 V820" class="dot"/>
  <path d="M1102 757 V820" class="dot"/>
  <path d="M775 747 V820" class="dot"/>
</svg>
