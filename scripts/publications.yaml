- title: Deflickering Vision-Based Occupancy Networks through Lightweight Spatio-Temporal Correlation
  author: Fengcheng Yu*, Haoran Xu*, Canming Xia, Ziyang Zong, Guang Tan
  conference: Pattern Recognition
  conference_abbr: PR
  year: 2026
  status: Major Revision Submitted
  teaser_url: images/deflickering_occ.png
  arxiv_url: https://arxiv.org/abs/2502.15438
  description: OccLinker, a plug-in that mines motion from discarded high-frequency frames to correct current-frame predictions. Raises mIoU by up to +3.09 across 4 base occupancy networks at 2.29% added memory, and improves temporal consistency by up to +7.68.

- title: Real-Time Multi-Camera Gaze Tracking for In-Vehicle Perception
  author: Chunyu Xia, Christina Suyong Shin, Fengcheng Yu, Chuan Li, Fan Bai, Harsha V. Madhyastha, Ramesh Govindan
  year: 2026
  status: Manuscript under double-blind review
  teaser_url: images/cargaze.png
  description: A real-time mobile sensing system that synchronizes multiple camera streams to track driver attention under limited hardware resources.

- title: "HouseTune: Two-Stage Floorplan Generation with LLM Assistance"
  author: Ziyang Zong, Guanying Chen, Zhaohuan Zhan, Fengcheng Yu, Guang Tan
  conference: AAAI Conference on Artificial Intelligence
  conference_abbr: AAAI'26
  year: 2026
  teaser_url: images/llm.png
  paper_url: https://ojs.aaai.org/index.php/AAAI/article/view/38417
  arxiv_url: https://arxiv.org/abs/2411.12279
  description: A two-stage pipeline where an LLM drafts the initial layout by chain-of-thought prompting and a conditional diffusion model refines it under physical constraints, without domain-specific training data.

- title: "Parkinson's severity diagnosis explainable model based on 3D multi-head attention residual network"
  author: Jiehui Huang, Lishan Lin, Fengcheng Yu, Xuedong He, Wenhui Song, Jiaying Lin, Zhenchao Tang, Kang Yuan, Yucheng Li, Haofan Huang, Zhong Pei, Wenbiao Xian, Calvin Yu-Chian Chen
  conference: Computers in Biology and Medicine
  conference_abbr: CIBM
  year: 2024
  teaser_url: images/pd-model.png
  paper_url: https://www.sciencedirect.com/science/article/pii/S001048252400043X
  description: MARNet, a 3D multi-head attention residual network pairing attention convolutions with an LSTM backbone to grade Parkinson's severity on the Hoehn-Yahr scale from short smartphone videos of facial expressions.
